<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胶片滚动效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 40px 0;
        }

        .film-container {
            width: 100%;
            max-width: 1200px;
            margin: 15px 0;
        }

        /* 胶片条样式 */
        .film-strip {
            position: relative;
            background: #0a0a0a;
            padding: 15px 0;
            border-radius: 8px;
            box-shadow: 
                0 10px 40px rgba(0,0,0,0.8),
                inset 0 2px 10px rgba(255,255,255,0.05);
        }

        /* 胶片栅格边框 - 上下齿孔 */
        .film-strip::before,
        .film-strip::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent 0px,
                    transparent 8px,
                    #1a1a1a 8px,
                    #1a1a1a 18px,
                    transparent 18px,
                    transparent 28px
                );
            background-size: 28px 100%;
        }

        .film-strip::before {
            top: 5px;
        }

        .film-strip::after {
            bottom: 5px;
        }

        /* 胶片内部阴影效果 */
        .film-inner {
            position: relative;
            overflow: hidden;
            margin: 25px 10px;
            background: #000;
            border-radius: 4px;
        }

        /* 滚动轨道 */
        .scroll-track {
            display: flex;
            width: fit-content;
        }

        /* 第1行 - 向左滚动 */
        .film-container:nth-child(2) .scroll-track {
            animation: scroll-left 30s linear infinite;
        }

        /* 第2行 - 向右滚动 */
        .film-container:nth-child(3) .scroll-track {
            animation: scroll-right 25s linear infinite;
        }

        /* 第3行 - 向左滚动 */
        .film-container:nth-child(4) .scroll-track {
            animation: scroll-left 35s linear infinite;
        }

        /* 第4行 - 向右滚动 */
        .film-container:nth-child(5) .scroll-track {
            animation: scroll-right 28s linear infinite;
        }

        /* 第5行 - 向左滚动 */
        .film-container:nth-child(6) .scroll-track {
            animation: scroll-left 32s linear infinite;
        }

        /* 悬停暂停 */
        .scroll-track:hover {
            animation-play-state: paused;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        @keyframes scroll-right {
            0% {
                transform: translateX(-50%);
            }
            100% {
                transform: translateX(0);
            }
        }

        /* 图片样式 */
        .film-frame {
            flex-shrink: 0;
            width: 280px;
            height: 180px;
            margin: 0 8px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            background: #222;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.4);
        }

        .film-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: sepia(20%) contrast(1.1);
        }

        .film-frame:hover img {
            transform: scale(1.1);
            filter: sepia(0%) contrast(1.2) brightness(1.1);
        }

        /* 胶片帧边框效果 */
        .film-frame::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            pointer-events: none;
            z-index: 1;
        }

        /* 胶片颗粒感 */
        .film-grain {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
        }

        /* 标题 */
        h1 {
            color: #f0f0f0;
            font-family: 'Georgia', serif;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 8px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .film-frame {
                width: 200px;
                height: 130px;
            }
            
            h1 {
                font-size: 1.5rem;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
